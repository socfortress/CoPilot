name: Custom.Sandbox.CollectFile
description: |
  Collect a target file for the CoPilot File Analysis module, plus forensic
  context (MOTW/zone.identifier, parent process correlation, prefetch, metadata).

  Read-only, non-executing collection. If the file is already gone (a dropper
  that wrote -> executed -> deleted within seconds), fall back to VSS copies and
  an $MFT lookup, and emit a "created and deleted quickly" indicator so the miss
  is itself a signal.

  Optional: the live code path uses Velociraptor's built-in FileFinder artifacts.
  Import this one only if you want the richer forensic context it collects.

type: CLIENT

parameters:
  - name: Path
    description: Full target filename (from the Sysmon Event 11 TargetFilename).
    type: string
  - name: Upload
    description: Whether to upload the file bytes (Y/N).
    default: "Y"
  - name: VSSAnalysis
    description: Attempt Volume Shadow Copy recovery if the live file is gone.
    type: bool
    default: Y

sources:
  # --- 1. The file itself + hashes + metadata -----------------------------
  - name: File
    query: |
      LET spec = SELECT OSPath, Size, Mtime, Atime, Ctime, Btime
        FROM glob(globs=Path)
        WHERE NOT IsDir

      LET with_hash = SELECT OSPath, Size, Mtime, Atime, Ctime, Btime,
             hash(path=OSPath) AS Hash
        FROM spec

      SELECT *,
             if(condition=Upload =~ "Y",
                then=upload(file=OSPath),
                else=NULL) AS Upload
      FROM with_hash

  # --- 2. Mark-of-the-Web (where the file came from) ----------------------
  - name: MOTW
    query: |
      -- Zone.Identifier ADS records the download source URL / zone id.
      SELECT OSPath,
             read_file(filename=OSPath + ":Zone.Identifier") AS ZoneIdentifier
      FROM glob(globs=Path)
      WHERE NOT IsDir

  # --- 3. Prefetch evidence of execution ----------------------------------
  - name: Prefetch
    query: |
      LET base <= basename(path=Path)
      SELECT OSPath, Mtime
      FROM glob(globs="C:/Windows/Prefetch/*.pf")
      WHERE OSPath =~ regex(str=base, options="i")

  # --- 4. Parent / creating process correlation (best-effort) -------------
  - name: CreatingProcess
    query: |
      -- Correlate to recent Sysmon FileCreate (EID 11) for this target, which
      -- carries the creating Image + ProcessGuid.
      SELECT System.TimeCreated.SystemTime AS Time,
             EventData.Image AS CreatingImage,
             EventData.ProcessGuid AS ProcessGuid,
             EventData.TargetFilename AS TargetFilename
      FROM parse_evtx(filename="C:/Windows/System32/winevt/Logs/Microsoft-Windows-Sysmon%4Operational.evtx")
      WHERE System.EventID.Value = 11
        AND EventData.TargetFilename = Path
      ORDER BY Time DESC
      LIMIT 5

  # --- 5. Race fallback: file gone -> VSS + $MFT --------------------------
  - name: DeletedFallback
    query: |
      LET live_exists = SELECT OSPath FROM glob(globs=Path) WHERE NOT IsDir

      -- Only run the fallback when the live file is absent.
      LET gone = SELECT * FROM if(
        condition=NOT live_exists,
        then={
          SELECT "file_created_and_deleted" AS Indicator,
                 Path AS TargetPath,
                 timestamp(epoch=now()) AS ObservedAt
          FROM scope()
        })

      LET vss_hits = SELECT OSPath, Size, Mtime
        FROM glob(globs="\\\\?\\GLOBALROOT\\Device\\HarddiskVolumeShadowCopy*/" + Path,
                  accessor="ntfs")
        WHERE VSSAnalysis AND NOT live_exists

      LET mft_hits = SELECT OSPath, FileName, InUse, FileSize
        FROM Artifact.Windows.NTFS.MFT(
              MFTDrive="C:",
              FileRegex=basename(path=Path))
        WHERE NOT live_exists
        LIMIT 20

      SELECT * FROM chain(
        a=gone,
        b={ SELECT "vss_copy" AS Indicator, OSPath AS TargetPath, Mtime AS ObservedAt FROM vss_hits },
        c={ SELECT "mft_record" AS Indicator, OSPath AS TargetPath, InUse AS StillInUse FROM mft_hits })
