minimumReleaseAge: 0

trustPolicy: off
trustPolicyExclude:
  - chokidar
  - semver

peerDependencyRules:
  allowedVersions:
    eslint: "10"

shellEmulator: true

overrides:
  "@codemirror/state": 6.7.0
  "@codemirror/view": 6.43.2
  "@mui/icons-material": ^7.3.9
  "@shuffleio/shuffle-mcps": 0.0.34

allowBuilds:
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  esbuild: true
  unrs-resolver: true
